    <script>
      // Перехватываем все API запросы React приложения
      const originalFetch = window.fetch;
      window.fetch = function(...args) {
        const url = args[0];
        
        // Если это запрос к API wexside.ru, перенаправляем на локальный API
        if (typeof url === 'string' && url.includes('wexside.ru/api')) {
          console.log('🔄 Перехвачен API запрос:', url);
          
          // Определяем тип запроса
          if (url.includes('/auth/register')) {
            return handleLocalRegister(args[1]);
          } else if (url.includes('/auth/login')) {
            return handleLocalLogin(args[1]);
          } else if (url.includes('/user')) {
            return handleLocalUser(args[1]);
          } else if (url.includes('/products')) {
            return handleLocalProducts();
          }
        }
        
        // Для всех остальных запросов используем оригинальный fetch
        return originalFetch.apply(this, args);
      };
      
      // Обработчик регистрации
      async function handleLocalRegister(options) {
        try {
          const body = JSON.parse(options.body);
          const result = await window.cfApi.register(body);
          
          return new Response(JSON.stringify(result), {
            status: result.success ? 200 : 400,
            headers: { 'Content-Type': 'application/json' }
          });
        } catch (error) {
          return new Response(JSON.stringify({ success: false, error: error.message }), {
            status: 500,
            headers: { 'Content-Type': 'application/json' }
          });
        }
      }
      
      // Обработчик авторизации
      async function handleLocalLogin(options) {
        try {
          const body = JSON.parse(options.body);
          const result = await window.cfApi.login(body.email, body.password);
          
          // Сохраняем токен в localStorage
          if (result.success) {
            localStorage.setItem('wexside_token', result.token);
            localStorage.setItem('wexside_user', JSON.stringify(result.user));
          }
          
          return new Response(JSON.stringify(result), {
            status: result.success ? 200 : 401,
            headers: { 'Content-Type': 'application/json' }
          });
        } catch (error) {
          return new Response(JSON.stringify({ success: false, error: error.message }), {
            status: 500,
            headers: { 'Content-Type': 'application/json' }
          });
        }
      }
      
      // Обработчик получения пользователя
      async function handleLocalUser(options) {
        try {
          const token = localStorage.getItem('wexside_token');
          const user = JSON.parse(localStorage.getItem('wexside_user') || '{}');
          
          if (!token || !user.id) {
            return new Response(JSON.stringify({ success: false, error: 'Not authenticated' }), {
              status: 401,
              headers: { 'Content-Type': 'application/json' }
            });
          }
          
          const result = await window.cfApi.getUser(user.id, token);
          
          return new Response(JSON.stringify(result), {
            status: result.success ? 200 : 404,
            headers: { 'Content-Type': 'application/json' }
          });
        } catch (error) {
          return new Response(JSON.stringify({ success: false, error: error.message }), {
            status: 500,
            headers: { 'Content-Type': 'application/json' }
          });
        }
      }
      
      // Обработчик получения продуктов
      async function handleLocalProducts() {
        try {
          const products = window.cfApi.getProducts();
          
          return new Response(JSON.stringify({ success: true, products }), {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          });
        } catch (error) {
          return new Response(JSON.stringify({ success: false, error: error.message }), {
            status: 500,
            headers: { 'Content-Type': 'application/json' }
          });
        }
      }
      
      console.log('✅ Локальный API перехватчик активирован');
      console.log('📝 Регистрация и авторизация работают локально');
      console.log('💾 Данные сохраняются в localStorage');
    </script>
